name: Consolidate chart projects
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidate-chart-projects
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'karagang/CIS-tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate and verify both chart projects
        env:
          SOURCE_COMMIT: d065a9bcb2d970e7c22010724a8a32c5f228483e
          PAYLOAD_SHA256: e9b2ec4484ad6aa0570d89605229ed195c5d25e05fd4d4bdda724dedca610614
        shell: bash
        run: |
          git fetch --no-tags https://github.com/karagang/east-coast-ice-charts.git "$SOURCE_COMMIT"
          git read-tree --prefix='Overlay Charts/' -u FETCH_HEAD
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile
          payload = Path('migration-payload.zip')
          import os
          assert hashlib.sha256(payload.read_bytes()).hexdigest() == os.environ['PAYLOAD_SHA256'], 'Upload checksum mismatch'
          with zipfile.ZipFile(payload) as archive:
              for name in archive.namelist():
                  p = PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts, 'Invalid archive path'
              archive.extractall('.')
          expected = json.loads(Path('.migration-expected.json').read_text(encoding='utf-8'))
          for name, checksum in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == checksum, 'Content mismatch: ' + name
          assert len(expected) == 174, 'Unexpected file count'
          Path('.migration-expected.json').unlink()
          print('Verified', len(expected), 'project files against the prepared manifest.')
          PY
          git add -f --all -- 'Anomaly Charts' 'Overlay Charts' README.md
          git rm --ignore-unmatch migration-payload.zip
          git config user.name 'karagang'
          git config user.email '118189743+karagang@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -p "$SOURCE_COMMIT" <<'MESSAGE'
          Consolidate chart tools into Anomaly Charts and Overlay Charts

          Add standalone Python and C# anomaly analysis, independent CSV snapshots,
          the Windows executable package, and user instructions. Migrate all overlay
          programs, data, previews, downloads and guides under Overlay Charts;
          retain the source Git history and refresh documentation links.
          MESSAGE
          )
          git push origin "$commit:refs/heads/main"
          echo "Published commit $commit"
